[project]
name = "enterprise-knowledge-assistant-backend"
version = "0.1.0"
description = "FastAPI RAG backend for an enterprise knowledge assistant"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.3",
  "asyncpg>=0.29.0",
  "cryptography>=42.0.0",
  "fastapi>=0.115.0",
  "greenlet>=3.1.1",
  "httpx>=0.27.2",
  "openai>=1.51.0",
  "pdfplumber>=0.11.4",
  "psycopg[binary]>=3.2.2",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.5.2",
  "pyjwt>=2.9.0",
  "python-docx>=1.1.2",
  "python-multipart>=0.0.12",
  "slowapi>=0.1.9",
  "SQLAlchemy>=2.0.35",
  "structlog>=24.4.0",
  "tenacity>=9.0.0",
  "tiktoken>=0.8.0",
  "uvicorn[standard]>=0.30.6"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.9"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]

[tool.ruff]
line-length = 100
target-version = "py311"
